<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid App - Page Not Found</title>
    <script>
      // Encode so token/mail (& and ?) stay inside redirect_path on index.html.
      var path = window.location.pathname + window.location.search;
      var redirectUrl = "/?redirect_path=" + encodeURIComponent(path);
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Loading deep link...</p>
  </body>
</html>
