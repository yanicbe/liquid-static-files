<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid App - Page Not Found</title>
    <script>
      // Preserve the original deep-link path in plain form so index.html
      // can consume it directly without extra encoding/decoding steps.
      var path = window.location.pathname + window.location.search;
      var redirectUrl = "/?redirect_path=" + path;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Loading deep link...</p>
  </body>
</html>
